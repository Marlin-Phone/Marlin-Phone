# @format

name: Generate Badges
on:
  push: # 当push时触发
    branches:
      - main
  schedule:
    - cron: "59 15 * * *" # 每天 UTC 时间 15:59 运行（即北京时间 23:59）
  workflow_dispatch:

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 目前 README 直接使用在线链接，这里暂时不再生成和提交本地 badges 文件
      - name: Skip badges generation
        run: echo "Badges are now loaded via online URLs; no local files needed."
