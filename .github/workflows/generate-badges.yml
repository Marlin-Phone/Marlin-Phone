name: Generate Badges
on:
  push: # 当push时触发
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # 每天运行一次
  workflow_dispatch:

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate badges
        run: |
          # 生成 GitHub stars 徽章
          curl -o badges/stars.svg "https://img.shields.io/github/stars/marlin-phone?style=flat&logoColor=%231677ff&labelColor=rgb(89, 89, 89)&color=%23ffda0a"

          # 生成 GitHub followers 徽章
          curl -o badges/followers.svg "https://img.shields.io/github/followers/marlin-phone?style=flat&logoColor=%231677ff&labelColor=rgb(89, 89, 89)&color=%23ffda0a"

          # 生成 GitHub Stats 徽章
          curl -o badges/stats.svg "https://github-readme-stats.vercel.app/api?username=Marlin-Phone&locale=en&line_height=33&show_icons=true&hide=&theme=&rank_icon=default&custom_title=Marlin's GitHub Stats"

          # 生成 Top Languages 徽章
          curl -o badges/languages.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Marlin-Phone&locale=en&line_height=33&theme=&langs_count=4&custom_title=Languages Used"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add badges/
          git commit -m "Update badges" || echo "No changes to commit"
          git push
